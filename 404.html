<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — BEAST FUEL</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230D0D0D%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Arial Black, sans-serif%22 font-weight=%22900%22 fill=%22%23CCFF00%22 text-anchor=%22middle%22>B</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--gap-md);
    }
    .not-found__code {
      font-family: var(--font-display);
      font-size: clamp(80px, 18vw, 180px);
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, #7CFF6B 50%, var(--accent-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .not-found__title {
      font-family: var(--font-display);
      font-size: clamp(20px, 3vw, 28px);
      text-transform: uppercase;
      margin: var(--gap-sm) 0 var(--gap-xs);
    }
    .not-found__text {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 400px;
      margin-bottom: var(--gap-lg);
    }
    .not-found__actions {
      display: flex;
      gap: var(--gap-sm);
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="custom-cursor" id="customCursor"></div>

  <section class="not-found">
    <div class="not-found__code">404</div>
    <h1 class="not-found__title">СТРАНИЦА НЕ НАЙДЕНА</h1>
    <p class="not-found__text">Похоже, эта страница ушла в закат — как и результаты без правильного питания. Но мы знаем, куда её вернуть.</p>
    <div class="not-found__actions">
      <a href="beastfuel.html" class="btn btn--primary">На главную</a>
      <a href="catalog.html" class="btn btn--ghost">Смотреть каталог</a>
    </div>
  </section>

  <script src="js/animations.js"></script>
</body>
</html>
